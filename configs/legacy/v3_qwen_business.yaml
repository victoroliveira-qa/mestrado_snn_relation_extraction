experiment:
  name: v3_qwen_business
  seed: 42
  output_dir: experiments
dataset:
  path: datasets/raw/DATASET_TREINO_BASE_merged.xlsx
  label_column: relation_label
  id_column: null
  expected_rows: null
embedding:
  provider: faiss
  path: datasets/embeddings/qwen_all_in_one_semantics_index.faiss
  normalize_input: false
  positional_alignment_verified: false
split:
  train: 0.8
  validation: 0.1
  test: 0.1
  stratify: auto
model:
  projection_dims:
  - 1024
  - 256
  head_dims:
  - 256
  - 128
  dropout: 0.3
  l2_regularization: 0.0001
  fusion: v3_ordered
training:
  epochs: 100
  batch_size: 64
  learning_rate: 0.001
  steps_per_epoch: 200
  validation_steps: 50
  positive_fraction: 0.5
  early_stopping_patience: 10
  reduce_lr_patience: 4
visualization:
  enabled: true
  tsne: true
  pacmap: true
  sample_size: 1000
architecture:
  name: snn_prototype
report:
  primary_metric: macro_f1
