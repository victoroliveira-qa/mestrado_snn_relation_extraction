split:
  train: 0.8
  validation: 0.1
  test: 0.1
  stratify: auto
model:
  projection_dims:
  - 1024
  - 256
  head_dims:
  - 256
  - 128
  dropout: 0.3
  l2_regularization: 0.0001
  fusion: v3_ordered
training:
  epochs: 100
  batch_size: 64
  learning_rate: 0.001
  steps_per_epoch: 200
  validation_steps: 50
  positive_fraction: 0.5
  early_stopping_patience: 10
  reduce_lr_patience: 4
visualization:
  enabled: true
  tsne: true
  pacmap: true
  sample_size: 1000
